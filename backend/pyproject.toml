[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jyotisha-backend"
version = "2.0.0"
description = "Jyotisha v2.0 — Precision Vedic Astrology API (NASA JPL DE440 ephemeris, Thirukanitha tradition)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "skyfield>=1.49",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pyswisseph>=2.10",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
jyotisha-api = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
pretty = true

[[tool.mypy.overrides]]
module = ["skyfield.*", "swisseph"]
ignore_missing_imports = true
